proxy-groups:
  - { name: Proxy, type: select, use: [MESL], proxies: [Fallback, Auto, US] }
  - { name: Apple, type: select, use: [MESL], proxies: [DIRECT, Proxy, Fallback, Auto] }
  - { name: AI, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto] }
  - { name: Google, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto] }
  - { name: BiliBili, type: select, use: [MESL], proxies: [DIRECT, Proxy, Fallback, Auto] }
  - { name: TikTok, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto, DIRECT] }
  - { name: Steam, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto, DIRECT] }
  - { name: Spotify, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto, DIRECT] }
  - { name: Facebook, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto] }
  - { name: Discord, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto] }
  - { name: Telegram, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto] }
  - { name: Instagram, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto] }
  - { name: Twitter, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto] }
  - { name: Twitch, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto] }
  - { name: Final, type: select, use: [MESL], proxies: [Proxy, Fallback, Auto, DIRECT] }
  - { name: Auto, type: url-test, use: [MESL], url: "https://cp.cloudflare.com/generate_204", interval: 300 }
  - { name: Fallback, type: fallback, use: [MESL], url: "https://cp.cloudflare.com/generate_204", interval: 300 }

proxy-providers:
  MESL: { type: http, url: "url", interval: 3600, path: ./MESL.yaml, proxy: DIRECT, health-check: { enable: true, interval: 600, url: "https://cp.cloudflare.com/generate_204" } }

